# dev-env Ansible configuration.
# Entry point is `make` -- never call ansible-playbook directly unless you
# know which env vars the Makefile normally exports (DEVENV_PYTHON,
# ANSIBLE_COLLECTIONS_PATH).
[defaults]
inventory            = ansible/inventory/localhost.ini
roles_path           = ansible/roles
collections_path     = ~/.local/share/dev-env/collections
interpreter_python   = auto_silent
host_key_checking    = False
display_skipped_hosts = False
retry_files_enabled  = False
# community.general removed the yaml callback in v12; ansible-core's default
# callback renders YAML natively via result_format instead.
stdout_callback      = default
result_format        = yaml
force_color          = True
deprecation_warnings = True

[ssh_connection]
pipelining = True
