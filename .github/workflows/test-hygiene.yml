name: Code Hygiene & Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check uv.lock currency
        run: |
          uv lock --check
          git diff --exit-code uv.lock

      - name: Sync dependencies
        run: uv sync --locked --extra test

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Verify Markdown Prettier formatting
        run: npx --yes prettier@3 --check "**/*.md"

      - name: Install Ansible collections
        run: uv run ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible-lint
        run: uv run --extra test ansible-lint
