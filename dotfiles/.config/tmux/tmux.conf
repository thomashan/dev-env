# Minimal, terminal-agnostic tmux config. Lives at ~/.config/tmux/tmux.conf
# (tmux >= 3.1 reads the XDG path; that is why this is not ~/.tmux.conf).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g automatic-rename on

# Intuitive splits that keep the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane movement.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# No shell in this file: everything is data, so a bad line fails loudly.
set -g status-position top
