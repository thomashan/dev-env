# Upstream factory-default tmux configuration. Lives at ~/.tmux.conf
# (linked to ~/.tmux.conf to prevent unmanaged legacy configuration files
# from shadowing repository settings and to allow conflict detection during setup).
#
# Vanilla upstream tmux factory defaults are in effect:
# - Standard prefix: C-b
# - Default window & pane indexing starting at 0
# - Standard splits: " (horizontal) and % (vertical)
# - Standard pane navigation via arrow keys
# - Standard bottom status bar
#
# Machine-local customizations should be placed in unversioned user configs.

# Enable mouse support so wheel scrolling enters tmux copy-mode instead of
# emitting arrow escape sequences (^[[B/^[OB/^[[A) in alternate screen mode
# (hold Shift to select text natively in the host terminal).
set -g mouse on

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Open new panes and windows in the current pane's working directory
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Forward extended modified keys (e.g., Shift+Enter) to inner TUIs such as Claude Code
# across macOS (Ghostty, Warp) and Windows/WSL (Windows Terminal).
# - `extended-keys always` forwards modified keys even when inner apps do not negotiate xterm extkeys.
# - `-sq` on `extended-keys-format csi-u` selects CSI-u on tmux 3.5+ (macOS Homebrew) while silently
#   ignoring the unknown option without stderr errors on tmux 3.4 (Ubuntu/WSL).
# - `xterm*:extkeys` enables extended-key capability matching for xterm-256color, xterm-ghostty, etc.
set -s extended-keys always
set -sq extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

