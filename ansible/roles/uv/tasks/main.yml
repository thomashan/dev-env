---
# uv and Python tooling (ruff, pre-commit) are installed via Conda into
# {{ devenv_conda_dir }} purely as application-development tools for the user.

- name: Install uv and Python development tools via Conda
  ansible.builtin.command:
    cmd: >-
      "{{ devenv_conda_dir }}/bin/conda" install -y -c conda-forge --override-channels
      uv {{ devenv_uv_tools | join(' ') }}
  register: devenv_conda_uv_install
  changed_when: "'All requested packages already installed' not in devenv_conda_uv_install.stdout and 'The following packages will be downloaded' in devenv_conda_uv_install.stdout"

- name: Locate uv binary in conda directory
  ansible.builtin.stat:
    path: "{{ devenv_conda_dir }}/bin/uv"
  register: devenv_uv_bin

- name: Assert uv is present in conda
  ansible.builtin.assert:
    that:
      - devenv_uv_bin.stat.exists
      - devenv_uv_bin.stat.executable | default(true)
    fail_msg: "uv install failed; {{ devenv_conda_dir }}/bin/uv missing or not executable"
    quiet: true

- name: Install additional CLI tools from a local checkout
  ansible.builtin.command:
    cmd: >-
      "{{ devenv_conda_dir }}/bin/uv" pip install --no-deps -e
      {{ devenv_holon_source }}/{{ devenv_holon_subdir }}
  when: devenv_holon_source | length > 0
  register: devenv_holon
  changed_when: "'Successfully installed' in devenv_holon.stdout or 'Updated' in devenv_holon.stdout"
