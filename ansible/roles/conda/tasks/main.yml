---
# Discovers and reuses existing Conda environments (Anaconda, Miniconda, Miniforge,
# Mambaforge, Homebrew cask) via `which conda` and candidate root paths.
# If no Conda is found, bootstraps Miniforge via Homebrew cask on macOS or
# micromamba via Homebrew on Linux.

- name: Probe existing conda in PATH
  ansible.builtin.command:
    cmd: which conda
  register: devenv_which_conda
  changed_when: false
  failed_when: false
  check_mode: false

- name: Stat candidate Conda binaries
  ansible.builtin.stat:
    path: "{{ item }}"
  register: devenv_conda_candidate_bin_stats
  loop: >-
    {{
      [
        '/opt/homebrew/bin/conda',
        '/opt/homebrew/Caskroom/miniforge/base/bin/conda',
        '/opt/homebrew/Caskroom/miniforge/base/condabin/conda',
        '/usr/local/bin/conda',
        '/home/linuxbrew/.linuxbrew/bin/conda',
        devenv_home ~ '/.linuxbrew/bin/conda'
      ] +
      ([ansible_facts.env.MAMBA_ROOT_PREFIX ~ '/bin/conda'] if (ansible_facts.env.MAMBA_ROOT_PREFIX is defined and ansible_facts.env.MAMBA_ROOT_PREFIX) else []) +
      [
        devenv_home ~ '/.local/share/mamba/bin/conda',
        devenv_home ~ '/micromamba/bin/conda',
        devenv_home ~ '/miniforge3/bin/conda',
        '/opt/conda/bin/conda'
      ]
    }}

- name: Stat candidate Conda roots
  ansible.builtin.stat:
    path: "{{ item }}"
  register: devenv_conda_candidate_stats
  loop: >-
    {{
      ([ansible_facts.env.MAMBA_ROOT_PREFIX] if (ansible_facts.env.MAMBA_ROOT_PREFIX is defined and ansible_facts.env.MAMBA_ROOT_PREFIX) else []) +
      [
        devenv_home ~ '/.local/share/mamba',
        devenv_home ~ '/micromamba',
        '/home/linuxbrew/.linuxbrew/opt/micromamba',
        devenv_home ~ '/.linuxbrew/opt/micromamba',
        '/opt/homebrew/Caskroom/miniforge/base',
        '/usr/local/Caskroom/miniforge/base',
        devenv_home ~ '/miniforge3',
        devenv_home ~ '/miniforge',
        devenv_home ~ '/mambaforge',
        devenv_home ~ '/miniconda3',
        devenv_home ~ '/anaconda3',
        '/opt/miniforge3',
        '/opt/conda'
      ]
    }}

- name: Resolve discovered Conda executable
  ansible.builtin.set_fact:
    devenv_discovered_conda_bin: >-
      {{
        (devenv_which_conda.stdout | trim)
        if (devenv_which_conda.rc == 0 and devenv_which_conda.stdout is defined and (devenv_which_conda.stdout | trim | length > 0))
        else ((devenv_conda_candidate_bin_stats.results | selectattr('stat.exists') | map(attribute='item') | list + ['']) | first)
      }}

- name: Probe conda base prefix
  ansible.builtin.command:
    cmd: "{{ devenv_discovered_conda_bin }} info --base"
  register: devenv_conda_info_base
  changed_when: false
  failed_when: false
  check_mode: false
  when: devenv_discovered_conda_bin | length > 0

- name: Resolve discovered Conda root directory
  ansible.builtin.set_fact:
    devenv_discovered_conda_dir: >-
      {{
        (devenv_conda_info_base.stdout | trim)
        if (devenv_conda_info_base.stdout is defined and (devenv_conda_info_base.stdout | trim | length > 0))
        else ((devenv_conda_candidate_stats.results | selectattr('stat.exists') | map(attribute='item') | list + ['']) | first)
      }}

- name: Fallback discovered Conda executable from root directory
  ansible.builtin.set_fact:
    devenv_discovered_conda_bin: "{{ devenv_discovered_conda_dir ~ '/bin/conda' }}"
  when:
    - devenv_discovered_conda_bin | length == 0
    - devenv_discovered_conda_dir | length > 0

- name: Install Miniforge via Homebrew cask on macOS
  community.general.homebrew_cask:
    name: miniforge
    state: present
    path: "{{ devenv_brew_bin | default(omit) }}"
  when:
    - devenv_discovered_conda_bin | length == 0
    - devenv_discovered_conda_dir | length == 0
    - devenv_system == 'Darwin'

- name: Install micromamba via Homebrew on Linux
  community.general.homebrew:
    name: micromamba
    state: present
    path: "{{ devenv_brew_bin | default(omit) }}"
  when:
    - devenv_discovered_conda_bin | length == 0
    - devenv_discovered_conda_dir | length == 0
    - devenv_system == 'Linux'

- name: Initialize Conda root environment with micromamba on Linux
  ansible.builtin.command:
    cmd: >-
      micromamba create -y -p "{{ devenv_conda_dir }}" -c conda-forge --override-channels
      conda python=3.13 ansible-core ansible-lint pyyaml
    creates: "{{ devenv_conda_dir }}/bin/conda"
  when:
    - devenv_discovered_conda_bin | length == 0
    - devenv_discovered_conda_dir | length == 0
    - devenv_system == 'Linux'

- name: Set active Conda directory
  ansible.builtin.set_fact:
    devenv_conda_dir: >-
      {{
        devenv_discovered_conda_dir
        if (devenv_discovered_conda_dir | length > 0)
        else (
          '/opt/homebrew/Caskroom/miniforge/base'
          if (devenv_system == 'Darwin' and devenv_arch in ['arm64', 'aarch64'])
          else ('/usr/local/Caskroom/miniforge/base' if devenv_system == 'Darwin' else devenv_conda_dir)
        )
      }}

- name: Set active Conda root alias
  ansible.builtin.set_fact:
    devenv_conda_root: "{{ devenv_conda_root | default(devenv_conda_dir) }}"

- name: Record the conda executable
  ansible.builtin.set_fact:
    devenv_conda_bin: >-
      {{
        devenv_discovered_conda_bin
        if (devenv_discovered_conda_bin | length > 0)
        else (devenv_conda_dir | trim ~ '/bin/conda')
      }}

- name: Assert conda is runnable
  ansible.builtin.command:
    cmd: "{{ devenv_conda_bin }} --version"
  register: devenv_conda_version
  changed_when: false
  failed_when: not ansible_check_mode and devenv_conda_version.rc != 0
  check_mode: false

- name: Show conda version
  ansible.builtin.debug:
    msg: "{{ devenv_conda_version.stdout | default('not installed (check mode)') }}"

- name: Inspect ~/.condarc
  ansible.builtin.stat:
    path: "{{ devenv_home }}/.condarc"
  register: devenv_condarc

- name: Assert .condarc is repo-managed before conda writes to it
  ansible.builtin.assert:
    that:
      - devenv_condarc.stat.islnk | default(false)
    fail_msg: "~/.condarc must be the repo-managed symlink; run the dotfiles role first"
    quiet: true

- name: Stat CA certificates directory
  ansible.builtin.stat:
    path: /usr/local/share/ca-certificates
  register: devenv_ca_certs_dir_stat
  when: ansible_facts['system'] | default(devenv_system) == 'Linux'

- name: Stat Conda cacert bundle
  ansible.builtin.stat:
    path: "{{ devenv_conda_root | default(devenv_conda_dir) }}/ssl/cacert.pem"
  register: devenv_conda_cacert_stat
  when: ansible_facts['system'] | default(devenv_system) == 'Linux'

- name: Discover custom CA certificates
  ansible.builtin.find:
    paths: /usr/local/share/ca-certificates
    patterns:
      - "*.crt"
      - "*.pem"
    file_type: file
  register: devenv_custom_ca_certs
  when:
    - ansible_facts['system'] | default(devenv_system) == 'Linux'
    - devenv_ca_certs_dir_stat.stat.exists | default(false)
    - devenv_ca_certs_dir_stat.stat.isdir | default(false)
    - devenv_conda_cacert_stat.stat.exists | default(false)

- name: Read custom CA certificates
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  register: devenv_custom_ca_contents
  loop: "{{ devenv_custom_ca_certs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - ansible_facts['system'] | default(devenv_system) == 'Linux'
    - devenv_custom_ca_certs.matched | default(0) > 0

- name: Inject custom CA certificates into Conda cacert bundle
  ansible.builtin.blockinfile:
    path: "{{ devenv_conda_root | default(devenv_conda_dir) }}/ssl/cacert.pem"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Custom CA {{ (item.item.path | default(item.path | default(''))) | basename }}"
    block: "{{ item.content | b64decode }}"
  loop: "{{ (devenv_custom_ca_contents.results | default([])) | selectattr('content', 'defined') | list }}"
  loop_control:
    label: "{{ (item.item.path | default(item.path | default(''))) | basename }}"
  when:
    - ansible_facts['system'] | default(devenv_system) == 'Linux'
    - devenv_custom_ca_contents.results is defined

- name: Create conda environments
  ansible.builtin.command:
    cmd: >-
      {{ devenv_conda_bin }} create -y -n {{ item.name }} python={{ item.python | default(devenv_conda_env_python) }}
    creates: "{{ devenv_conda_dir }}/envs/{{ item.name }}/bin/python"
  loop: "{{ devenv_conda_envs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install Conda development tools
  ansible.builtin.command:
    cmd: >-
      "{{ devenv_conda_bin }}" install -y -c conda-forge --override-channels
      {{ devenv_conda_tools | join(' ') }}
    creates: "{{ devenv_conda_dir }}/bin/uv"

- name: Install additional CLI tools from a local checkout
  ansible.builtin.command:
    cmd: >-
      "{{ devenv_conda_dir }}/bin/uv" pip install --python "{{ devenv_conda_dir }}/bin/python" --no-deps -e
      {{ devenv_holon_source }}/{{ devenv_holon_subdir }}
  when: devenv_holon_source | length > 0
  register: devenv_holon
  changed_when: "'Successfully installed' in devenv_holon.stdout or 'Updated' in devenv_holon.stdout"

- name: Check if fish is available for Conda clean-shell verification
  ansible.builtin.command:
    cmd: which fish
  register: devenv_conda_has_fish
  changed_when: false
  failed_when: false
  check_mode: false

- name: Verify Conda activation in a clean Fish login shell
  ansible.builtin.command:
    cmd: >-
      env -i HOME="{{ devenv_home }}" USER="{{ devenv_user }}"
      PATH="/usr/bin:/bin:/usr/sbin:/sbin:{{ (devenv_conda_has_fish.stdout | trim) | dirname }}"
      "{{ devenv_conda_has_fish.stdout | trim }}" -lc
      'type -t conda; echo "ENV=$CONDA_DEFAULT_ENV"; string join : $PATH'
  register: devenv_conda_verify_fish
  when:
    - not ansible_check_mode
    - devenv_conda_has_fish.rc == 0
  changed_when: false
  check_mode: false

- name: Assert Conda function, default env, and PATH in Fish
  ansible.builtin.assert:
    that:
      - "'function' in devenv_conda_verify_fish.stdout"
      - "'ENV=base' in devenv_conda_verify_fish.stdout or ('ENV=' in devenv_conda_verify_fish.stdout and 'ENV=\n' not in devenv_conda_verify_fish.stdout)"
      - "(devenv_conda_dir ~ '/bin') in devenv_conda_verify_fish.stdout"
    fail_msg: |
      Conda failed to activate in a clean Fish login shell. Output:
      {{ devenv_conda_verify_fish.stdout_lines | default([]) | join(' | ') }}
    quiet: true
  when:
    - not ansible_check_mode
    - devenv_conda_has_fish.rc == 0

- name: Check if zsh is available for Conda clean-shell verification
  ansible.builtin.command:
    cmd: which zsh
  register: devenv_conda_has_zsh
  changed_when: false
  failed_when: false
  check_mode: false

- name: Verify Conda activation in a clean Zsh login interactive shell
  ansible.builtin.command:
    cmd: >-
      env -i HOME="{{ devenv_home }}" USER="{{ devenv_user }}"
      PATH="/usr/bin:/bin:/usr/sbin:/sbin:{{ (devenv_conda_has_zsh.stdout | trim) | dirname }}"
      "{{ devenv_conda_has_zsh.stdout | trim }}" -lic
      'type conda; echo "ENV=${CONDA_DEFAULT_ENV:-}"; echo "PATH=$PATH"'
  register: devenv_conda_verify_zsh
  when:
    - not ansible_check_mode
    - devenv_conda_has_zsh.rc == 0
  changed_when: false
  check_mode: false

- name: Assert Conda function, default env, and PATH in Zsh
  ansible.builtin.assert:
    that:
      - "'function' in devenv_conda_verify_zsh.stdout"
      - "'ENV=base' in devenv_conda_verify_zsh.stdout or ('ENV=' in devenv_conda_verify_zsh.stdout and 'ENV=\n' not in devenv_conda_verify_zsh.stdout)"
      - "(devenv_conda_dir ~ '/bin') in devenv_conda_verify_zsh.stdout"
    fail_msg: |
      Conda failed to activate in a clean Zsh login shell. Output:
      {{ devenv_conda_verify_zsh.stdout_lines | default([]) | join(' | ') }}
    quiet: true
  when:
    - not ansible_check_mode
    - devenv_conda_has_zsh.rc == 0

- name: Check if bash is available for Conda clean-shell verification
  ansible.builtin.command:
    cmd: which bash
  register: devenv_conda_has_bash
  changed_when: false
  failed_when: false
  check_mode: false

- name: Verify Conda activation in a clean Bash login interactive shell
  ansible.builtin.command:
    cmd: >-
      env -i HOME="{{ devenv_home }}" USER="{{ devenv_user }}"
      PATH="/usr/bin:/bin:/usr/sbin:/sbin:{{ (devenv_conda_has_bash.stdout | trim) | dirname }}"
      "{{ devenv_conda_has_bash.stdout | trim }}" -lic
      'type -t conda; echo "ENV=${CONDA_DEFAULT_ENV:-}"; echo "PATH=$PATH"'
  register: devenv_conda_verify_bash
  when:
    - not ansible_check_mode
    - devenv_conda_has_bash.rc == 0
  changed_when: false
  check_mode: false

- name: Assert Conda function, default env, and PATH in Bash
  ansible.builtin.assert:
    that:
      - "'function' in devenv_conda_verify_bash.stdout"
      - "'ENV=base' in devenv_conda_verify_bash.stdout or ('ENV=' in devenv_conda_verify_bash.stdout and 'ENV=\n' not in devenv_conda_verify_bash.stdout)"
      - "(devenv_conda_dir ~ '/bin') in devenv_conda_verify_bash.stdout"
    fail_msg: |
      Conda failed to activate in a clean Bash login shell. Output:
      {{ devenv_conda_verify_bash.stdout_lines | default([]) | join(' | ') }}
    quiet: true
  when:
    - not ansible_check_mode
    - devenv_conda_has_bash.rc == 0
