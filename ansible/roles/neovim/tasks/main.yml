---
# Neovim is installed via Homebrew across both macOS and Linux (Linuxbrew)
# to guarantee Neovim >= 0.12 with vim.pack and nvim-pack-lock.json support.

- name: Locate Homebrew
  ansible.builtin.stat:
    path: "{{ item }}"
  register: devenv_brew_stat
  loop:
    - /opt/homebrew/bin/brew
    - /usr/local/bin/brew
    - /home/linuxbrew/.linuxbrew/bin/brew
    - "{{ devenv_home }}/.linuxbrew/bin/brew"
  when: devenv_brew_bin is not defined or (devenv_brew_bin | length == 0)

- name: Record Homebrew location
  ansible.builtin.set_fact:
    devenv_brew_bin: "{{ (devenv_brew_stat.results | selectattr('stat.exists') | map(attribute='item') | list + ['']) | first }}"
  when: devenv_brew_bin is not defined or (devenv_brew_bin | length == 0)

- name: Install Neovim via Homebrew
  community.general.homebrew:
    name: neovim
    state: present
    path: "{{ devenv_brew_bin | default(omit) }}"
  when: devenv_neovim_source == 'brew'

- name: Read the installed Neovim version
  ansible.builtin.command:
    cmd: nvim --version
  register: devenv_nvim_version
  changed_when: false
  failed_when: not ansible_check_mode and devenv_nvim_version.rc != 0
  check_mode: false

- name: Assert Neovim is new enough for vim.pack and nvim-pack-lock.json
  ansible.builtin.assert:
    that:
      - devenv_nvim_version.stdout_lines[0] is match('NVIM v')
      - devenv_nvim_version.stdout_lines[0] | regex_replace('^NVIM v', '') is version('0.12', '>=')
    fail_msg: >-
      {{ devenv_nvim_version.stdout_lines[0] }} is too old; dotfiles/nvim-kickstart/.config/nvim/init.lua
      uses vim.pack() + nvim-pack-lock.json (0.12+). Ensure Neovim >= 0.12 is installed via Homebrew
      (devenv_neovim_source: brew).
    quiet: true
  when:
    - devenv_nvim_version.rc == 0
    - devenv_active_nvim_variant | default('kickstart') == 'kickstart'

- name: Sync plugins declared in init.lua at their locked revisions
  ansible.builtin.command:
    cmd: nvim --headless -c 'sleep 5000m' -c 'qa'
  register: devenv_nvim_sync
  changed_when: true
  tags: [nvim-sync]
  when: devenv_active_nvim_variant | default('kickstart') == 'kickstart'

- name: Count loaded packages
  ansible.builtin.command:
    cmd: >-
      nvim --headless -c 'lua local n=#vim.pack.get() io.write("packages=" .. n)' -c 'qa'
  register: devenv_nvim_pkgs
  changed_when: false
  failed_when: not ansible_check_mode and devenv_nvim_pkgs.rc != 0
  check_mode: false
  tags: [nvim-sync]
  when: devenv_active_nvim_variant | default('kickstart') == 'kickstart'

- name: Report plugin count
  ansible.builtin.debug:
    msg: "{{ devenv_nvim_pkgs.stdout | default('not checked this run') }}"
  when: devenv_nvim_pkgs.stdout is defined
