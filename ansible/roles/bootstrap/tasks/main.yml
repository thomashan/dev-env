---
# Runs first: classifies the host, loads the OS/package-manager variable table,
# loads user choices if present, and refuses to continue on unsupported platforms.

- name: Classify host platform
  ansible.builtin.set_fact:
    devenv_repo_root: "{{ (playbook_dir ~ '/..') | realpath }}"
    devenv_system: "{{ ansible_facts.system }}"
    devenv_arch: "{{ ansible_facts.architecture }}"
    devenv_pkg_backend: "{{ devenv_backend_for_system.get(ansible_facts.system, 'unsupported') }}"
    devenv_is_wsl: >-
      {{ (ansible_facts.system == 'Linux') and
         (('microsoft' in (ansible_facts.kernel | default('') | lower)) or
          ('wsl' in (ansible_facts.kernel | default('') | lower)) or
          (((ansible_facts.env | default({})).WSL_DISTRO_NAME | default('')) | length > 0) or
          (((ansible_facts.env | default({})).WSL_INTEROP | default('')) | length > 0)) }}

# choices.yml is written once by the wizard, so the stow list it carries goes
# stale whenever the repo grows a new package. Keep the repo's list so it can be
# merged back in below instead of being silently overwritten by include_vars.
- name: Snapshot repository default stow packages
  ansible.builtin.set_fact:
    devenv_repo_stow_packages: "{{ devenv_stow_packages }}"

- name: Check if choices.yml exists
  ansible.builtin.stat:
    path: "{{ devenv_home }}/.config/dev-env/choices.yml"
  register: devenv_choices_stat

- name: Load choices.yml if present
  ansible.builtin.include_vars:
    file: "{{ devenv_home }}/.config/dev-env/choices.yml"
  when: devenv_choices_stat.stat.exists

- name: Resolve active variant and inactive packages
  ansible.builtin.set_fact:
    devenv_active_nvim_variant: >-
      {{ devenv_selected_variants.nvim if (devenv_selected_variants is defined and devenv_selected_variants and 'nvim' in devenv_selected_variants) else devenv_package_variants.nvim.default }}
    devenv_inactive_packages: >-
      {{ (devenv_package_variants.nvim.variants.values() | map(attribute='package') | list)
         | difference([devenv_package_variants.nvim.variants[devenv_selected_variants.nvim if (devenv_selected_variants is defined and devenv_selected_variants and 'nvim' in devenv_selected_variants) else devenv_package_variants.nvim.default].package]) }}

- name: Resolve active stow packages
  ansible.builtin.set_fact:
    devenv_stow_packages: >-
      {{ (((devenv_repo_stow_packages | default(devenv_stow_packages)) | union(devenv_stow_packages) | difference(devenv_inactive_packages))
         + [devenv_package_variants.nvim.variants[devenv_active_nvim_variant].package]) | unique | sort }}

- name: Update link manifest for minimal nvim variant
  ansible.builtin.set_fact:
    devenv_links: >-
      {{ (devenv_links | rejectattr('src', 'match', '^dotfiles/nvim-kickstart/') | list) +
         [{'src': 'dotfiles/nvim-minimal/.config/nvim/init.lua', 'dest': devenv_home ~ '/.config/nvim/init.lua'}] }}
  when: devenv_active_nvim_variant == 'minimal'

- name: Update link manifest for lazyvim nvim variant
  ansible.builtin.set_fact:
    devenv_links: >-
      {{ (devenv_links | rejectattr('src', 'match', '^dotfiles/nvim-kickstart/') | list) +
         [{'src': 'dotfiles/nvim-lazyvim/.config/nvim/init.lua', 'dest': devenv_home ~ '/.config/nvim/init.lua'},
          {'src': 'dotfiles/nvim-lazyvim/.config/nvim/lua/config/lazy.lua', 'dest': devenv_home ~ '/.config/nvim/lua/config/lazy.lua'},
          {'src': 'dotfiles/nvim-lazyvim/.config/nvim/lua/config/autocmds.lua', 'dest': devenv_home ~ '/.config/nvim/lua/config/autocmds.lua'},
          {'src': 'dotfiles/nvim-lazyvim/.config/nvim/lua/config/keymaps.lua', 'dest': devenv_home ~ '/.config/nvim/lua/config/keymaps.lua'},
          {'src': 'dotfiles/nvim-lazyvim/.config/nvim/lua/config/options.lua', 'dest': devenv_home ~ '/.config/nvim/lua/config/options.lua'},
          {'src': 'dotfiles/nvim-lazyvim/.config/nvim/lua/plugins/example.lua', 'dest': devenv_home ~ '/.config/nvim/lua/plugins/example.lua'}] }}
  when: devenv_active_nvim_variant == 'lazyvim'

- name: Filter skipped links from manifest
  ansible.builtin.set_fact:
    devenv_links: "{{ devenv_links | rejectattr('dest', 'in', devenv_skip_links | default([])) | list }}"
  when: (devenv_skip_links | default([])) | length > 0

# Backreference escaping differs by context in ansible-core: '\1' inside a
# {{ }} template, but '\\1' in a bare `that:`/`when:` expression.
- name: Cover every package referenced by the link manifest
  ansible.builtin.set_fact:
    devenv_stow_packages: >-
      {{ devenv_stow_packages | union(devenv_links | map(attribute='src') | map('regex_replace', '^dotfiles/([^/]+)/.*$', '\1') | unique | list) | sort }}

- name: Load OS-specific variables
  ansible.builtin.include_vars:
    file: "{{ devenv_repo_root }}/ansible/vars/os_{{ devenv_system }}.yml"

- name: Fail early on an unsupported package backend
  ansible.builtin.fail:
    msg: >-
      Package backend '{{ devenv_pkg_backend }}' has no variable table.
      Supported: brew (macOS), apt (Debian/Ubuntu).
      To add another distro, create ansible/vars/pkg_<mgr>.yml mapping every
      logical name in ansible/group_vars/all.yml, then list it in
      devenv_supported_backends.
  when: devenv_pkg_backend not in devenv_supported_backends

- name: Load package-manager alias table
  ansible.builtin.include_vars:
    file: "{{ devenv_repo_root }}/ansible/vars/pkg_{{ devenv_pkg_backend }}.yml"

- name: Build the wanted list (logical names minus OS-provided ones)
  ansible.builtin.set_fact:
    devenv_packages_wanted: >-
      {{ (devenv_packages_core + devenv_packages_extra)
         | difference(devenv_pkg_skip | default([])) | unique | sort }}

- name: Fail when a logical package has no alias for this package manager
  ansible.builtin.assert:
    that:
      - devenv_pkg_aliases is mapping
      - (devenv_packages_wanted | difference(devenv_pkg_aliases.keys() | list)) | length == 0
    fail_msg: >-
      ansible/vars/pkg_{{ devenv_pkg_backend }}.yml is missing aliases for:
      {{ devenv_packages_wanted | difference(devenv_pkg_aliases.keys() | list) | join(', ') }}
    quiet: true

- name: Resolve logical names to concrete package names
  ansible.builtin.set_fact:
    devenv_packages_concrete: "{{ devenv_packages_wanted | map('extract', devenv_pkg_aliases) | unique | sort }}"

- name: Show resolved plan
  ansible.builtin.debug:
    msg:
      - "platform   : {{ devenv_system }}/{{ devenv_arch }}  backend: {{ devenv_pkg_backend }}  wsl: {{ devenv_is_wsl }}"
      - "packages   : {{ devenv_packages_concrete | length }} concrete ({{ devenv_pkg_skip | default([]) | join(',') }} skipped as OS-provided)"
      - "python pin : {{ devenv_python_version }}   conda dir: {{ devenv_conda_dir }}"
      - "repo root  : {{ devenv_repo_root }}"
      - "stow pkgs  : {{ devenv_stow_packages | join(', ') }}"
      - "active nvim: {{ devenv_active_nvim_variant }} (package: {{ devenv_package_variants.nvim.variants[devenv_active_nvim_variant].package }})"
