---
# Symlink the repo into $HOME using GNU Stow (--no-folding). Only paths listed
# in devenv_links are touched, so ~/.config itself is never linked wholesale
# and other apps' config is safe.

- name: Locate GNU Stow binary
  ansible.builtin.command:
    cmd: which stow
  register: devenv_stow_bin
  changed_when: false
  failed_when: false

- name: Assert GNU Stow is available
  ansible.builtin.assert:
    that:
      - devenv_stow_bin.rc == 0
    fail_msg: >-
      GNU Stow was not found on PATH. stow is a hard prerequisite for dotfiles
      management. Please install stow via your package manager or run the packages role.
    quiet: true

- name: Unstow inactive variant packages
  ansible.builtin.command:
    cmd: >-
      stow --delete -v
      {{ '-n' if ansible_check_mode else '' }}
      -d "{{ devenv_repo_root }}/dotfiles"
      -t "{{ devenv_home }}"
      {{ devenv_inactive_packages | join(' ') }}
  when: (devenv_inactive_packages | default([])) | length > 0
  register: devenv_unstow_inactive
  changed_when: "'UNLINK:' in devenv_unstow_inactive.stderr"
  failed_when: false

- name: Filter out skipped link paths
  ansible.builtin.set_fact:
    devenv_links: "{{ devenv_links | rejectattr('dest', 'in', devenv_skip_links | default([])) | list }}"
  when: (devenv_skip_links | default([])) | length > 0

- name: Omit stow packages where all links are skipped
  ansible.builtin.set_fact:
    devenv_stow_packages: >-
      {{ devenv_stow_packages | intersect(devenv_links | map(attribute='src') | map('regex_replace', '^dotfiles/([^/]+)/.*$', '\1') | unique | list) }}
  when: (devenv_skip_links | default([])) | length > 0

- name: Assert stow packages cover all active link manifest packages
  ansible.builtin.assert:
    that:
      - (devenv_links | map(attribute='src') | map('regex_replace', '^dotfiles/([^/]+)/.*$', '\\1') | unique | list | difference(devenv_stow_packages)) | length == 0
    fail_msg: >-
      GNU Stow would not link these manifest packages (stale ~/.config/dev-env/choices.yml?):
      {{ devenv_links | map(attribute='src') | map('regex_replace', '^dotfiles/([^/]+)/.*$', '\1') | unique | list | difference(devenv_stow_packages) | join(', ') }}
    quiet: true

- name: Determine ignore arguments for GNU Stow
  ansible.builtin.set_fact:
    devenv_stow_ignore_opts: >-
      {{ (devenv_skip_links | default([]) | map('basename') | map('regex_escape') | map('regex_replace', '^(.*)$', '--ignore="^\1$"') | list | join(' ')) }}
  when: (devenv_skip_links | default([])) | length > 0

- name: Timestamp for this run's backups
  ansible.builtin.set_fact:
    devenv_backup_dir: "{{ devenv_home }}/.local/share/dev-env/backup/{{ ansible_facts.date_time.iso8601_basic_short }}"
  when: devenv_backup_dotfiles | bool

# Validated up front: a directory source would either clobber a populated
# destination or be silently half-managed, so the manifest must list files.
- name: Inspect the repository sources
  ansible.builtin.stat:
    path: "{{ devenv_repo_root }}/{{ item.src }}"
  loop: "{{ devenv_links }}"
  loop_control:
    label: "{{ item.src }}"
  register: devenv_src_stat

- name: Assert every manifest entry is a real file in this repo
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - not (item.stat.isdir | default(true))
    fail_msg: >-
      {{ item.item.src }} is {{ 'missing' if not (item.stat.exists | default(false)) else 'a directory' }}.
      devenv_links must list individual files so that files from other tools
      living in the same destination directory are never displaced.
    quiet: true
  loop: "{{ devenv_src_stat.results }}"
  loop_control:
    label: "{{ item.item.src }}"

- name: Ensure link destinations have parent directories
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ devenv_links }}"
  loop_control:
    label: "{{ item.dest | dirname }}"

- name: Inspect current destinations
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  register: devenv_dest_stat
  loop: "{{ devenv_links }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Ensure backup directory exists if unmanaged files are found
  ansible.builtin.file:
    path: "{{ devenv_backup_dir }}"
    state: directory
    mode: "0700"
  when:
    - devenv_backup_dotfiles | bool
    - devenv_dest_stat.results | selectattr('stat.exists') | rejectattr('stat.islnk') | list | length > 0

- name: Move an unmanaged real file out of the way before linking
  ansible.builtin.command:
    cmd: /bin/mv "{{ item.item.dest }}" "{{ devenv_backup_dir }}/{{ item.item.dest | regex_replace('^/', '') | regex_replace('/', '__') }}"
  loop: "{{ devenv_dest_stat.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when:
    - devenv_backup_dotfiles | bool
    - item.stat.exists
    - not item.stat.islnk
  changed_when: true

- name: Back up, then report what was displaced
  ansible.builtin.debug:
    msg: >-
      Displaced {{ (devenv_dest_stat.results | rejectattr('stat.islnk', 'defined') | list | length) }}
      unmanaged path(s) into {{ devenv_backup_dir | default('(backups disabled)') }} --
      real files/dirs found where links belong:
      {{ devenv_dest_stat.results | selectattr('stat.exists') | rejectattr('stat.islnk') | map(attribute='item.dest') | join(', ') | default('none', true) }}

- name: Remove stale symlinks not pointing to expected Stow package source
  ansible.builtin.file:
    path: "{{ item.item.dest }}"
    state: absent
  loop: "{{ devenv_dest_stat.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when:
    - item.stat.exists | default(false)
    - item.stat.islnk | default(false)
    - >-
      (item.stat.lnk_source if (item.stat.lnk_source | default('')).startswith('/')
       else (item.item.dest | dirname ~ '/' ~ (item.stat.lnk_source | default('')))) | realpath != (devenv_repo_root ~ '/' ~ item.item.src) | realpath

- name: Inspect legacy tmux XDG symlink
  ansible.builtin.stat:
    path: "{{ devenv_home }}/.config/tmux/tmux.conf"
  register: devenv_legacy_tmux_stat

- name: Remove legacy tmux XDG symlink
  ansible.builtin.file:
    path: "{{ devenv_home }}/.config/tmux/tmux.conf"
    state: absent
  when:
    - devenv_legacy_tmux_stat.stat.exists | default(false)
    - devenv_legacy_tmux_stat.stat.islnk | default(false)
    - >-
      (((devenv_legacy_tmux_stat.stat.lnk_source if (devenv_legacy_tmux_stat.stat.lnk_source | default('')).startswith('/')
        else (devenv_home ~ '/.config/tmux/' ~ (devenv_legacy_tmux_stat.stat.lnk_source | default('')))) | realpath).startswith(devenv_repo_root)) or
      ('dotfiles/tmux/.config/tmux/tmux.conf' in (devenv_legacy_tmux_stat.stat.lnk_source | default('')))

- name: Execute GNU Stow to link per-tool dotfiles packages
  ansible.builtin.command:
    cmd: >-
      stow --no-folding --restow -v
      {{ '-n' if ansible_check_mode else '' }}
      {{ devenv_stow_ignore_opts | default('') }}
      -d "{{ devenv_repo_root }}/dotfiles"
      -t "{{ devenv_home }}"
      {{ devenv_stow_packages | join(' ') }}
  when: (devenv_stow_packages | default([])) | length > 0
  register: devenv_stow_result
  changed_when: "'LINK:' in devenv_stow_result.stderr or 'UNLINK:' in devenv_stow_result.stderr"

# Post-conditions are only meaningful after links were actually created; in a
# dry run nothing was linked, so verifying would report false failures.
- name: Verify every managed path is a link into this repository
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  register: devenv_link_check
  loop: "{{ devenv_links }}"
  loop_control:
    label: "{{ item.dest }}"
  when: not ansible_check_mode

- name: Assert the link manifest is fully satisfied
  ansible.builtin.assert:
    that:
      - item.stat.islnk | default(false)
      - >-
        (((item.stat.lnk_source if (item.stat.lnk_source | default('')).startswith('/')
          else (item.item.dest | dirname ~ '/' ~ (item.stat.lnk_source | default('')))) | realpath).startswith(devenv_repo_root))
    fail_msg: "{{ item.item.dest }} is not a symlink into {{ devenv_repo_root }}"
    quiet: true
  loop: "{{ devenv_link_check.results | default([], true) }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: not ansible_check_mode
