---
# Linux. ansible_facts.pkg_mgr comes from setup facts (apt / dnf / pacman).
devenv_become_package_install: true
devenv_pkg_skip:
  - neovim
devenv_casks: []
devenv_brew_taps: []

# Neovim source for this platform (see comment in group_vars/all.yml)
devenv_neovim_source: brew

# Linux Conda / Micromamba prefix default resolution
devenv_conda_dir: >-
  {{
    ansible_facts.env.MAMBA_ROOT_PREFIX
    if (ansible_facts.env.MAMBA_ROOT_PREFIX is defined and (ansible_facts.env.MAMBA_ROOT_PREFIX | length > 0))
    else (devenv_home ~ '/miniforge3')
  }}
