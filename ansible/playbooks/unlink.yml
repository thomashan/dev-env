---
# Reversibility: remove ONLY the symlinks listed in devenv_links using GNU Stow.
# Real files are never deleted, and backups created by the dotfiles role are left alone.
- name: Unlink managed dotfiles
  hosts: control
  gather_facts: true
  vars:
    devenv_repo_root: "{{ (playbook_dir ~ '/../..') | realpath }}"
  tasks:
    - name: Load the manifest
      ansible.builtin.include_vars:
        file: "{{ devenv_repo_root }}/ansible/group_vars/all.yml"

    - name: Check for user choices
      ansible.builtin.stat:
        path: "{{ devenv_home }}/.config/dev-env/choices.yml"
      register: devenv_choices_stat

    - name: Load user choices if present
      ansible.builtin.include_vars:
        file: "{{ devenv_home }}/.config/dev-env/choices.yml"
      when: devenv_choices_stat.stat.exists

    - name: Locate GNU Stow binary
      ansible.builtin.command:
        cmd: which stow
      register: devenv_stow_bin
      changed_when: false
      failed_when: false

    - name: Assert GNU Stow is available
      ansible.builtin.assert:
        that:
          - devenv_stow_bin.rc == 0
        fail_msg: >-
          GNU Stow was not found on PATH. stow is required for unlinking managed dotfiles.
          Please install stow first.
        quiet: true

    - name: Collect all stow packages to unlink (active and inactive variants)
      ansible.builtin.set_fact:
        devenv_all_stow_packages: >-
          {{ ((devenv_stow_packages | default([])) +
              (devenv_package_variants.nvim.variants.values() | map(attribute='package') | list))
             | unique | sort }}

    - name: Find which managed paths are symlinks
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      register: devenv_unlink_stat
      loop: "{{ devenv_links }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: Refuse to remove anything that is not our symlink
      ansible.builtin.assert:
        that:
          - item.stat.islnk | default(false)
          - >-
            (((item.stat.lnk_source if (item.stat.lnk_source | default('')).startswith('/')
              else (item.item.dest | dirname ~ '/' ~ (item.stat.lnk_source | default('')))) | realpath).startswith(devenv_repo_root))
        fail_msg: "{{ item.item.dest }} exists but is not a symlink into {{ devenv_repo_root }}; refusing to delete."
        quiet: true
      loop: "{{ devenv_unlink_stat.results }}"
      loop_control:
        label: "{{ item.item.dest }}"
      when: item.stat.exists | default(false)

    - name: Invoke stow to delete all declared variant packages
      ansible.builtin.command:
        cmd: >-
          stow --delete -v
          -d "{{ devenv_repo_root }}/dotfiles"
          -t "{{ devenv_home }}"
          {{ devenv_all_stow_packages | join(' ') }}
      register: devenv_stow_unlink
      changed_when: "'UNLINK:' in devenv_stow_unlink.stderr"
      failed_when: false

    - name: Inspect legacy tmux XDG symlink
      ansible.builtin.stat:
        path: "{{ devenv_home }}/.config/tmux/tmux.conf"
      register: devenv_legacy_tmux_stat

    - name: Remove legacy tmux XDG symlink
      ansible.builtin.file:
        path: "{{ devenv_home }}/.config/tmux/tmux.conf"
        state: absent
      when:
        - devenv_legacy_tmux_stat.stat.exists | default(false)
        - devenv_legacy_tmux_stat.stat.islnk | default(false)
        - >-
          (((devenv_legacy_tmux_stat.stat.lnk_source if (devenv_legacy_tmux_stat.stat.lnk_source | default('')).startswith('/')
            else (devenv_home ~ '/.config/tmux/' ~ (devenv_legacy_tmux_stat.stat.lnk_source | default('')))) | realpath).startswith(devenv_repo_root)) or
          ('dotfiles/tmux/.config/tmux/tmux.conf' in (devenv_legacy_tmux_stat.stat.lnk_source | default('')))
